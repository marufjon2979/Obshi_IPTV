name: Update Russian EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3,15 * * *"

permissions:
  contents: write

jobs:
  build-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Obshi IPTV
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download EPG generator
        run: git clone --depth 1 https://github.com/iptv-org/epg.git epg-tool

      - name: Install dependencies
        working-directory: epg-tool
        run: npm ci

      - name: Generate Russian EPG
        working-directory: epg-tool
        run: |
          npm run grab --- --sites=tv.mail.ru --days=7 --output=../epg.xml --gzip=../epg.xml.gz

      - name: Check generated files
        run: |
          test -s epg.xml
          test -s epg.xml.gz
          ls -lh epg.xml epg.xml.gz

      - name: Commit EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml epg.xml.gz
          git diff --cached --quiet || (
            git commit -m "Update Russian EPG"
            git push
          )
